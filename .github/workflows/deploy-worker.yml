# Build the model worker image and deploy it to Cloud Run on an NVIDIA L4 that scales to zero.
# Does nothing until deploy/gcp/setup.sh has run and its four values are set as repository
# variables (GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA). No keys: GitHub
# signs in through Workload Identity Federation.
name: Deploy model worker
on:
  push:
    branches: [main]
    paths: ["workers/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: deploy-worker
jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: renovai-models
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q numpy
      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/renovai/models:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" workers
          docker push "$IMAGE"
      # One L4 without zonal redundancy ($0.0001867/s in us-central1, Oct 2026), the minimum
      # 4 vCPU / 16 GiB, at most one instance, none when idle. Raise --max-instances with traffic.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" \
            --gpu 1 --gpu-type nvidia-l4 --no-gpu-zonal-redundancy \
            --cpu 4 --memory 16Gi --no-cpu-throttling \
            --min-instances 0 --max-instances 1 --concurrency 4 --timeout 300 \
            --service-account "renovai-worker@$PROJECT.iam.gserviceaccount.com" \
            --set-secrets RENOVAI_WORKER_TOKEN=renovai-worker-token:latest \
            --allow-unauthenticated --quiet
      # The service is public at the network level; every route checks the bearer token.
      - name: Check the deployed worker on the sample photo
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          TOKEN="$(gcloud secrets versions access latest --secret renovai-worker-token)"
          echo "::add-mask::$TOKEN"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/health")" = 401
          curl -fsS --max-time 300 -H "Authorization: Bearer $TOKEN" "$URL/health"; echo
          curl -fsS --max-time 300 -H "Authorization: Bearer $TOKEN" --data-binary @samples/kober_photos/p7_0_1920x1200.jpg \
            -D headers.txt -o light.npy "$URL/lighting"
          grep -i '^x-seconds' headers.txt
          python3 -c "import numpy as np; a = np.load('light.npy'); assert a.ndim == 3 and a.shape[2] == 3 and np.isfinite(a).all(), a.shape; print('lighting', a.shape)"
          echo "### Model worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
